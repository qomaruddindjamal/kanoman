[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanoman"
version = "0.1.1"
description = "Kanoman AI — Modular, Secure AI Development Orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "qomaruddindjamal", email = "jamalpancur@gmail.com" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ai = [
    "httpx>=0.27.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
kanoman = "kanoman.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
